# Parameters of the pm_skills skills.
#
# Read by the pm_skills node at start (restart it after a change) and by the
# planner (pm_pddl_planning) on every evaluation, so planned and executed
# motions use the same values. Installed to share/pm_skills/config; rebuild
# pm_skills after editing (or build with --symlink-install).
#
# Lengths in m.

# Robot frame a gripped component is attached to and aligned with.
gripper_frame: PM_Robot_Tool_TCP

grip:
  # Above the gripping frame, along the gripper TCP z axis.
  approach_offset: 0.05
  sensing_start_offset: 0.0005
  # Force grip: end of the sensing move and its rough phase.
  sensing_end_offset: -0.0005
  sensing_end_rough: 0.0002
  gripping_offset: 0.0001
  # Relative move of the gripper after gripping (and after a failed grip).
  lift_distance: 0.05

release:
  # Relative move of the gripper after releasing a component.
  lift_distance: 0.02

line_of_sight:
  # Measurement planning checks (/assembly_manager/check_line_of_sight): a
  # sensor needs the surroundings of a frame clear, not one point, and the
  # part's orientation is known only roughly before it is measured. Rays onto
  # a ring of this radius around the frame are checked too, each also tilted
  # by the tolerance; 0 and 0: one ray. Assumed values, to be confirmed.
  feature_radius:
    camera: 0.0003
    laser: 0.00005
    confocal: 0.00005
  # Tilt of the part around its expected orientation [deg].
  tilt_tolerance_deg: 0.5
